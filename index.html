<!DOCTYPE html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon / Tab Logo ── -->
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />

    <!-- ── Primary SEO ── -->
    <title>Pondtora | Fish Farm Management & Fish Pond Management App</title>
    <meta name="description" content="Pondtora is the #1 fish farm management and fish pond management app for commercial and local fish farmers. Track fish ponds, daily feeding, feed stock inventory, farm expenses, staff, and sales invoices. Start your free 30-day trial." />
    <meta name="keywords" content="fish farm management, fish pond management, fish farm management Nigeria, catfish farm management app, fish farming software, pond management system, aquaculture software, fish farm tracker, catfish farming app, tilapia farm management, fish farm record keeping, fish farming tool" />
    <meta name="author" content="Pondtora" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <link rel="canonical" href="https://pondtora.site/" />

    <!-- ── Open Graph (Facebook, WhatsApp preview) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pondtora.site/" />
    <meta property="og:title" content="Pondtora — Fish Farm Management & Fish Pond Management App" />
    <meta property="og:description" content="Manage your fish farm and ponds from your phone or PC. Track ponds, daily feeding, feed stock inventory, finances, staff, and sales. Try free for 30 days." />
    <meta property="og:image" content="https://pondtora.site/og-image.png" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:site_name" content="Pondtora" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pondtora — Fish Farm Management & Fish Pond Management App" />
    <meta name="twitter:description" content="Manage your fish farm and ponds from your phone or PC. Track ponds, daily feeding, feed stock, finances, staff, and sales. Start free for 30 days." />
    <meta name="twitter:image" content="https://pondtora.site/og-image.png" />

    <!-- ── Mobile / PWA ── -->
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pondtora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- ── Geo targeting (Nigeria & Global) ── -->
    <meta name="geo.region" content="NG" />
    <meta name="geo.placename" content="Nigeria" />

    <!-- ── JSON-LD Structured Data ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pondtora",
      "alternateName": ["Pondtora Fish Farm Management", "Pondtora Fish Pond Management"],
      "url": "https://pondtora.site"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Pondtora",
      "url": "https://pondtora.site",
      "logo": "https://pondtora.site/logo.png",
      "description": "Comprehensive fish farm management and fish pond management software. Track ponds, daily feeding, feed stock, farm finances, staff reports and sales invoices — all from your phone or computer.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, Android, iOS, Windows, macOS",
      "inLanguage": "en",
      "offers": {
        "@type": "Offer",
        "price": "3000",
        "priceCurrency": "NGN",
        "availability": "https://schema.org/InStock",
        "priceValidUntil": "2027-12-31",
        "description": "Starter plan — up to 5 ponds"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "bestRating": "5",
        "reviewCount": "53"
      },
      "featureList": [
        "Pond and fish stock management",
        "Daily feeding records",
        "Feed stock and inventory tracking",
        "Financial dashboard — income and expenses",
        "Staff management and permissions",
        "Daily, weekly and monthly farm reports",
        "Sales invoicing and customer management",
        "Staff knowledge and compatibility assessments"
      ],
      "audience": {
        "@type": "Audience",
        "audienceType": "Fish Farmers, Aquaculture Businesses, Catfish Farmers, Tilapia Farmers"
      }
    }
    </script>

    <!-- ── FAQ Structured Data (helps Google show FAQs in search results) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Pondtora?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pondtora is a fish farm management app built for Nigerian fish farmers. It helps you track ponds, feeding, feed stock, expenses, staff, and sales — all from your phone."
          }
        },
        {
          "@type": "Question",
          "name": "Does Pondtora work for catfish farming?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Pondtora is designed specifically for catfish and tilapia farmers in Nigeria. You can track all pond types including earthen, concrete, and tarpaulin ponds."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need a computer to use Pondtora?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Pondtora works on any smartphone. Your staff can record feeding and submit reports from their phones, and you can check everything from your own phone or computer."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Pondtora cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pondtora starts at ₦3,000 per month for the Starter plan (up to 5 ponds). There is a free 30-day trial — no credit card required to start."
          }
        }
      ]
    }
    </script>

    <!-- ── Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
